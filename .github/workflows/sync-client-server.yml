name: Sync Client and Server to Repo B and C

on:
  push:
    branches:
      - main

jobs:
  sync-client:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: PR to Client
    steps:
      - uses: actions/checkout@v3

      - name: Check for client folder changes
        id: check_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'

      - name: Continue only if client changed
        if: steps.check_changes.outputs.client == 'true'
        run: echo "Client changes detected."

      - name: Clone client
        if: steps.check_changes.outputs.client == 'true'
        uses: actions/checkout@v3
        with:
          repository: franco950/Agri-marketplace-client
          token: ${{ secrets.agrigo }}
          path: Agri-marketplace-client

      - name: Sync client folder
        if: steps.check_changes.outputs.client == 'true'
        run: |
          rm -rf Agri-marketplace-client/*
          cp -r client/* Agri-marketplace-client/

      - name: Commit and Push
        if: steps.check_changes.outputs.client == 'true'
        run: |
          cd Agri-marketplace-client
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Sync client from Agri-Marketplace-Platform"
          git push origin HEAD:auto-client-sync
        continue-on-error: true

      - name: Create PR to Client
        if: steps.check_changes.outputs.client == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.agrigo }}
          repository: franco950/Agri-marketplace-client
          title: "Update: Client changes from Platform"
          body: "Automated PR for client updates."
          head: auto-client-sync
          base: main

  sync-server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: PR to Server
    steps:
      - uses: actions/checkout@v3

      - name: Check for server folder changes
        id: check_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'

      - name: Continue only if server changed
        if: steps.check_changes.outputs.server == 'true'
        run: echo "Server changes detected."

      - name: Clone Server repo
        if: steps.check_changes.outputs.server == 'true'
        uses: actions/checkout@v3
        with:
          repository: franco950/Agri-marketplace-server
          token: ${{ secrets.agrigo }}
          path: Agri-marketplace-server

      - name: Sync server folder
        if: steps.check_changes.outputs.server == 'true'
        run: |
          rm -rf Agri-marketplace-server/*
          cp -r server/* Agri-marketplace-server/

      - name: Commit and Push
        if: steps.check_changes.outputs.server == 'true'
        run: |
          cd Agri-marketplace-server
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Sync server from Agri-Marketplace-Platform"
          git push origin HEAD:auto-server-sync
        continue-on-error: true

      - name: Create PR to Repo C
        if: steps.check_changes.outputs.server == 'true'
        uses: franco950/create-pull-request@v5
        with:
          token: ${{ secrets.agrigo }}
          repository: franco950/Agri-marketplace-server
          title: "Update: Server changes from Platform"
          body: "Automated PR for server updates."
          head: auto-server-sync
          base: main
